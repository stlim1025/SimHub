openapi: 3.0.3
info:
  title: SimCenter API
  description: SimCenter 개인 F1 기록·시즌·텔레메트리 플랫폼 REST API 계약서 (개인 모드, D-25)
  version: 1.0.0
servers:
  - url: /api/v1
    description: API v1 Base Path

paths:
  /auth/register:
    post:
      summary: 회원가입
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 회원가입 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/400ValidationError'
        '500':
          $ref: '#/components/responses/500ServerError'

  /auth/login:
    post:
      summary: 로그인
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공 및 JWT 발급
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/400ValidationError'
        '401':
          description: 로그인 실패 (아이디/비밀번호 불일치)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/500ServerError'

  /me:
    get:
      summary: 내 프로필 조회 (계정 + 설정, docs/14)
      operationId: getMyProfile
      responses:
        '200':
          description: 프로필 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500ServerError'

  /me/profile:
    put:
      summary: 내 프로필·설정 저장 (전체 교체, docs/14 §5)
      description: |
        표시 이름·랭킹 공개 여부·프로필 사진·게임 환경·타임존·테마를 한 번에 저장한다. `avatarTeam`만 null 허용(사진 없음).
        표시 이름은 가입과 같은 규칙(trim 후 1~50자). enum 값은 이름 문자열(대소문자 무시), 모르는 값·팀 코드·타임존은 400.
        `showOnLeaderboard`가 false면 랭킹(`/rankings`, RankingHub `RankingUpdated`)의 내 표시 이름이 "익명 드라이버"로 보인다(D-39).
      operationId: updateMyProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: 저장된 프로필
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/400ValidationError'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500ServerError'

  /me/email:
    post:
      summary: 로그인 이메일 변경 (현재 비밀번호 확인, docs/14 §5)
      description: |
        새 이메일은 가입과 같이 정규화(trim + 소문자)·검증한다. 현재 비밀번호가 틀리면 401이 아니라 400(`errors.currentPassword`) —
        앱은 401을 세션 만료로 보고 로그아웃시키기 때문이다. 이미 쓰는 이메일은 409. 발급된 JWT의 email 클레임은 다음 로그인 때 갱신된다.
        비밀번호 추측을 늦추도록 사용자당 분당 10회로 제한한다(넘으면 429).
      operationId: changeMyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeEmailRequest'
      responses:
        '200':
          description: 이메일이 바뀐 프로필
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/400ValidationError'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '409':
          description: 다른 계정이 이미 쓰는 이메일
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500ServerError'

  /rankings:
    get:
      summary: 랭킹 TOP10 조회 (Time Trial 세션만)
      operationId: getRankings
      parameters:
        - name: trackId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: 트랙 GUID
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [daily, monthly, yearly]
            default: monthly
          description: 랭킹 기간
        - name: gameCode
          in: query
          required: false
          schema:
            type: string
            default: F1_25
          description: 게임 코드
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: 랭킹 기준일 (미지정 시 오늘)
      responses:
        '200':
          description: 랭킹 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankingSnapshot'
        '400':
          $ref: '#/components/responses/400ValidationError'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500ServerError'

  /tracks:
    get:
      summary: 트랙 목록 조회
      description: |
        트랙 마스터 전체. 게임 → `displayOrder`(F1 25 캘린더 24개 → 리버스 3개 → Madrid → 옛 트랙, D-43) → 이름 순.
        국기는 `countryCode`(ISO 3166-1 alpha-2)로 앱이 그린다.
      operationId: getTracks
      responses:
        '200':
          description: 트랙 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackListResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500ServerError'

  /me/laps:
    get:
      summary: 내 랩 기록 조회 (My Lap Record)
      operationId: getMyLaps
      parameters:
        - name: trackId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: 필터링할 트랙 ID
        - name: sessionType
          in: query
          required: false
          schema:
            type: string
          description: '필터링할 세션 타입 (예: TimeTrial)'
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [recent, fastest]
            default: recent
          description: |
            정렬 기준 (대소문자 무시).
            `recent` = 최근 세운 순, `fastest` = 유효 랩 우선 · 빠른 랩타임 순 (무효 랩은 맨 뒤).
        - name: validOnly
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: true면 유효 랩(게임 판정 `isValid`)만
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          description: 페이지 번호 (1-base)
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
          description: 페이지 크기
      responses:
        '200':
          description: 내 기록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyLapRecordResponse'
        '400':
          $ref: '#/components/responses/400ValidationError'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500ServerError'

  /me/laps/{lapId}:
    get:
      summary: 내 랩 상세 조회 (Lap Details)
      description: |
        랩 + 트랙 국가 + 같은 세션 키의 내 세션(`sessionId`, 없으면 null) + 랩 끝 스냅샷(`car`·`conditions`, 없으면 null)
        + 드라이버 어시스트(`assists`, D-51, 하나도 모르면 null)
        + 비교 대상(`comparison`, docs/15 §10 D-51 — `compare`로 고른다, 기본 = 같은 트랙·게임의 내 최고 유효 랩, 이 랩일 수도 있음).
        비교 대상이 없으면 `comparison` = null이고 `comparisonUnavailable`이 까닭이다(`compare=none`이면 둘 다 null).
        남의 랩은 **랭킹 적격 랩만** 비교 대상이 된다(리더보드에 이미 공개된 기록). 이름은 랭킹과 같은 규칙(이름 비공개 = "익명 드라이버", D-39).
        남의 랩과 없는 랩은 같은 404다(D-34). `lapId`가 GUID 형식이 아니면 경로가 맞지 않아 404다.
      operationId: getMyLap
      parameters:
        - name: lapId
          in: path
          required: true
          description: 랩 ID (GUID)
          schema:
            type: string
            format: uuid
        - name: compare
          in: query
          required: false
          description: |
            비교 대상(대소문자 무시). `best` = 내 최고 유효 랩 · `leaderboard` = 같은 트랙·게임의 랭킹 적격 랩(모든 사용자, 전체 기간) 중 최고
            · `lap` = `compareLapId`의 랩(내 랩이면 무엇이든, 남의 랩이면 랭킹 적격만) · `none` = 비교 안 함
          schema:
            type: string
            enum: [best, leaderboard, lap, none]
            default: best
        - name: compareLapId
          in: query
          required: false
          description: "`compare=lap`일 때 필수(없으면 400). 그 밖에는 무시"
          schema:
            type: string
            format: uuid
        - name: sameTeam
          in: query
          required: false
          description: "`best`·`leaderboard`만: 이 랩과 같은 팀. 이 랩의 팀을 모르면 적용하지 않는다(`appliedFilters`에 빠짐)"
          schema:
            type: boolean
            default: false
        - name: sameSessionType
          in: query
          required: false
          description: "`best`·`leaderboard`만: 이 랩과 같은 세션 유형"
          schema:
            type: boolean
            default: false
        - name: sameAssists
          in: query
          required: false
          description: "`best`·`leaderboard`만: 이 랩과 같은 어시스트(아는 칸만 비교). 어시스트를 하나도 모르면 적용하지 않는다"
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 내 랩 상세 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LapDetailResponse'
        '400':
          $ref: '#/components/responses/400ValidationError'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          description: 랩을 찾을 수 없음 (남의 랩 포함)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/500ServerError'

  /me/laps/{lapId}/trace:
    get:
      summary: 내 랩 텔레메트리 트레이스 조회 (Telemetry)
      description: |
        거리 기준 표본(`resolutionM` m 간격, D-45) 7채널. 배열은 모두 `sampleCount` 길이의 정수 배열이다.
        `timeMs` 랩 시작부터 ms · `speedKph` · `throttle`/`brake` 0~100 · `steer` −100~100 · `gear` −1~8(0=N, −1=R) · `rpm`.
        `extra`는 추가 채널 맵(D-49, 같은 길이의 실수 배열)이며 없으면 `{}`다.
        트레이스가 없는 랩(이전 Agent로 기록)·남의 랩·없는 랩은 404다.
      operationId: getMyLapTrace
      parameters:
        - name: lapId
          in: path
          required: true
          description: 랩 ID (GUID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 트레이스 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LapTraceResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          description: 트레이스 없음 (남의 랩·없는 랩 포함)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/500ServerError'

  /laps/{lapId}/trace:
    get:
      summary: 비교 랩 텔레메트리 트레이스 조회 (Compare with)
      description: |
        랩 상세의 비교 랩 트레이스(docs/15 §10, D-51). 모양은 `/me/laps/{lapId}/trace`와 같다.
        공개 규칙: 내 랩이거나 남의 **랭킹 적격** 랩만. 남의 비공개 랩·없는 랩·트레이스 없는 랩은 모두 같은 404다(D-34).
      operationId: getComparableLapTrace
      parameters:
        - name: lapId
          in: path
          required: true
          description: 랩 ID (GUID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 트레이스 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LapTraceResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          description: 트레이스 없음 (남의 비공개 랩·없는 랩 포함)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/500ServerError'

  /me/tracks:
    get:
      summary: 내 트랙별 요약 조회
      description: |
        내가 랩을 세운 트랙별로 랩 수(무효 랩 포함), 유효 랩 최고 기록, 마지막으로 랩을 세운 시각을 돌려준다.
        마지막으로 랩을 세운 트랙이 먼저 온다. 랩이 없으면 빈 목록.
      operationId: getMyTracks
      responses:
        '200':
          description: 내 트랙 요약 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyTracksResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500ServerError'

  /me/seasons:
    get:
      summary: 내 시즌 목록 조회 (Seasons)
      description: |
        내 시즌을 마지막 세션 시각(`lastSessionAt`) 내림차순으로 돌려준다(같으면 Id 내림차순).
        내 순위·점수와 선두는 시즌 Standings(기록된 세션의 점수 합, 본 레이스 카운트백)에서 계산한다.
        시즌 목록은 한 번에 그 시즌들의 결과를 읽어 순위를 계산하므로 `pageSize` 최대는 20이다.

        데이터는 Agent가 보내는 `SessionClassified` 이벤트로 쌓인다
        ([session_classified.json](../schema/session_classified.json)).
      operationId: getMySeasons
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          description: 페이지 번호 (1-base). 1 미만이면 1로 보정한다.
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 20
          description: 페이지 크기. 1 미만이면 기본값(20), 최대(20)를 넘으면 최대로 보정한다.
      responses:
        '200':
          description: 내 시즌 목록 조회 성공 (시즌이 없으면 빈 목록)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonSummaryPage'
        '400':
          $ref: '#/components/responses/400ValidationError'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500ServerError'

  /me/seasons/{seasonId}:
    get:
      summary: 내 시즌 상세 조회 (Season 탭 · Standings 탭 · 결과표 탭)
      description: |
        시즌 헤더 + 라운드(그랑프리 주말) 목록 + Standings(드라이버·컨스트럭터, 결과표 칸 포함)를 한 번에 돌려준다.
        세 탭이 같은 스냅샷을 쓰기 때문이다.
        남의 시즌과 없는 시즌은 같은 404다(존재 여부를 알려 주지 않는다).
        `seasonId`가 GUID 형식이 아니면 경로가 맞지 않아 404다.
      operationId: getMySeason
      parameters:
        - name: seasonId
          in: path
          required: true
          description: 시즌 ID (GUID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 내 시즌 상세 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonDetail'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          description: 시즌을 찾을 수 없음 (남의 시즌 포함)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/500ServerError'

  /me/sessions:
    get:
      summary: 내 세션 목록 조회 (Sessions)
      description: |
        최종 순위가 확정된 세션(Time Trial 제외)을 분류 시각(`classifiedAt`) 내림차순으로 돌려준다(같으면 Id 내림차순).
        `My*` 필드는 내 차 결과에서 읽으며, 내 차 결과가 없으면 null이다.

        데이터는 Agent가 보내는 `SessionClassified` 이벤트로 쌓인다
        ([session_classified.json](../schema/session_classified.json)).
      operationId: getMySessions
      parameters:
        - name: sessionType
          in: query
          required: false
          schema:
            type: string
            enum: [Practice, Qualifying, Race]
          description: |
            세션 유형 필터. 대소문자를 구분하지 않으며 이 세 이름만 허용한다
            (`TimeTrial`·숫자·오타는 400, 비어 있으면 전체).
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          description: 페이지 번호 (1-base). 1 미만이면 1로 보정한다.
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
          description: 페이지 크기. 1 미만이면 기본값(20), 최대(100)를 넘으면 최대로 보정한다.
      responses:
        '200':
          description: 내 세션 목록 조회 성공 (세션이 없으면 빈 목록)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionSummaryPage'
        '400':
          $ref: '#/components/responses/400ValidationError'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500ServerError'

  /me/sessions/{sessionId}:
    get:
      summary: 내 세션 상세 조회 (Session 결과표)
      description: |
        세션 헤더 + 결과(`position` 오름차순, 같으면 `carIndex`)를 돌려준다.
        남의 세션과 없는 세션은 같은 404다(존재 여부를 알려 주지 않는다).
        `sessionId`가 GUID 형식이 아니면 경로가 맞지 않아 404다.
      operationId: getMySession
      parameters:
        - name: sessionId
          in: path
          required: true
          description: 세션 ID (GUID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 내 세션 상세 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetail'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          description: 세션을 찾을 수 없음 (남의 세션 포함)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/500ServerError'

  /me/agent-pairing-codes:
    post:
      summary: Agent 연결 코드 발급
      description: |
        Agent를 내 계정에 연결할 1회용 코드(10분 유효)를 발급한다.
        같은 사용자의 이전 미사용 코드는 모두 무효화된다. 사용자당 분당 10회로 제한한다.
      operationId: issueAgentPairingCode
      responses:
        '201':
          description: 연결 코드 발급 성공 (코드 원문은 이 응답에서만 확인할 수 있다)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingCodeResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500ServerError'

  /agent/pair:
    post:
      summary: Agent 연결 (연결 코드 → 장치 키 교환)
      description: |
        연결 코드를 소비하고 코드 주인의 계정에 장치를 만든다. 장치 키 원문은 이 응답에서 한 번만 내려간다.
        코드가 없음·만료·사용됨·무효화됨인 경우는 모두 같은 400으로 응답한다. IP당 분당 10회로 제한한다.
      operationId: pairAgent
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairRequest'
      responses:
        '200':
          description: 연결 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairResponse'
        '400':
          $ref: '#/components/responses/400ValidationError'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500ServerError'

  /me/agent-devices:
    get:
      summary: 내 Agent 장치 목록
      description: 연결 해제된 장치는 제외하며, 연결 시각(createdAt) 내림차순으로 돌려준다.
      operationId: listMyAgentDevices
      responses:
        '200':
          description: 장치 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDeviceListResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500ServerError'

  /me/agent-devices/{deviceId}:
    delete:
      summary: Agent 장치 연결 해제
      operationId: revokeMyAgentDevice
      parameters:
        - name: deviceId
          in: path
          required: true
          description: 장치 ID (GUID)
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 연결 해제 성공
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          description: 본인의 장치가 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: 장치를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/500ServerError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    400ValidationError:
      description: 요청 데이터 검증 실패 (RFC 7807 Problem Details)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorDetails'
    401Unauthorized:
      description: 인증 정보가 없거나 올바르지 않음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    429TooManyRequests:
      description: 요청 제한 초과 (고정 창 한도를 넘으면 본문 없이 429를 돌려준다)
    500ServerError:
      description: 서버 내부 에러
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          example: "https://simcenter/errors/unauthorized"
        title:
          type: string
          example: "Unauthorized"
        status:
          type: integer
          example: 401
        detail:
          type: string
          example: "Access token is missing or invalid."
        traceId:
          type: string
          example: "00-85f269a91176b668f447cfb62e49c71c-0000000000000000-00"

    ValidationErrorDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
              example:
                deviceName:
                  - "장치 이름은 50자 이하여야 합니다."

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - displayName
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          format: password
          example: "SecureP@ss123"
        displayName:
          type: string
          minLength: 1
          maxLength: 50
          example: "홍길동"

    RegisterResponse:
      type: object
      required:
        - userId
        - displayName
      properties:
        userId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        displayName:
          type: string
          example: "홍길동"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          format: password
          example: "SecureP@ss123"

    LoginResponse:
      type: object
      required:
        - accessToken
        - expiresAt
        - user
      properties:
        accessToken:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        expiresAt:
          type: string
          format: date-time
          example: "2026-07-06T10:00:00Z"
        user:
          $ref: '#/components/schemas/UserSummary'

    UserSummary:
      description: 로그인 응답의 사용자 요약(이메일·설정 미포함 — 앱은 로그인 뒤 `GET /me`로 프로필을 받는다).
      type: object
      required:
        - userId
        - displayName
      properties:
        userId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        displayName:
          type: string
          example: "홍길동"

    UserProfile:
      description: 내 프로필(계정 + 설정, docs/14). `GET /me`·`PUT /me/profile`·`POST /me/email` 공통 응답.
      type: object
      required:
        - userId
        - email
        - displayName
        - showOnLeaderboard
        - avatarTeam
        - preferredGame
        - controller
        - console
        - units
        - timeZoneId
        - theme
      properties:
        userId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        email:
          type: string
          format: email
          example: "user@example.com"
        displayName:
          type: string
          example: "홍길동"
        showOnLeaderboard:
          type: boolean
          description: false면 랭킹의 내 표시 이름이 "익명 드라이버"로 보인다(D-39). 기본 true.
          example: true
        avatarTeam:
          type: string
          nullable: true
          enum: [MER, FER, RBR, MCL, AST, ALP, WIL, RB, SAU, HAA, null]
          description: 프로필 사진 팀 코드(`AvatarTeamCode` + null). null이면 앱이 이름 첫 글자를 보인다.
          example: "MCL"
        preferredGame:
          type: string
          enum: [F1_25]
          example: "F1_25"
        controller:
          $ref: '#/components/schemas/ControllerTypeName'
        console:
          $ref: '#/components/schemas/ConsolePlatformName'
        units:
          $ref: '#/components/schemas/UnitSystemName'
        timeZoneId:
          type: string
          description: IANA 타임존 ID(기본 Asia/Seoul). 저장만 한다 — 랭킹 기간 경계는 서버 설정(D-27).
          example: "Asia/Seoul"
        theme:
          $ref: '#/components/schemas/ThemePreferenceName'

    UpdateProfileRequest:
      description: 프로필·설정 전체 교체. `avatarTeam`만 null(사진 없음) 허용, 나머지는 필수.
      type: object
      required:
        - displayName
        - showOnLeaderboard
        - preferredGame
        - controller
        - console
        - units
        - timeZoneId
        - theme
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 50
          description: trim 후 1~50자(가입과 같은 규칙).
          example: "lemonary"
        showOnLeaderboard:
          type: boolean
          example: false
        avatarTeam:
          type: string
          nullable: true
          enum: [MER, FER, RBR, MCL, AST, ALP, WIL, RB, SAU, HAA, null]
          description: 프로필 사진 팀 코드(`AvatarTeamCode` + null = 사진 없음).
          example: "MCL"
        preferredGame:
          type: string
          enum: [F1_25]
          example: "F1_25"
        controller:
          $ref: '#/components/schemas/ControllerTypeName'
        console:
          $ref: '#/components/schemas/ConsolePlatformName'
        units:
          $ref: '#/components/schemas/UnitSystemName'
        timeZoneId:
          type: string
          maxLength: 64
          description: 서버가 찾을 수 있는 IANA ID만(Windows ID 거부).
          example: "Europe/London"
        theme:
          $ref: '#/components/schemas/ThemePreferenceName'

    ChangeEmailRequest:
      type: object
      required:
        - newEmail
        - currentPassword
      properties:
        newEmail:
          type: string
          format: email
          example: "new@example.com"
        currentPassword:
          type: string
          format: password
          example: "SecureP@ss123"

    AvatarTeamCode:
      description: 프로필 사진 팀 코드(팀 색 원 + 코드로 그린다 — 실제 로고는 쓰지 않는다, docs/14 §4). 백엔드 `AvatarTeamCodes`·앱 `kAvatarTeams`와 같은 목록.
      type: string
      enum: [MER, FER, RBR, MCL, AST, ALP, WIL, RB, SAU, HAA]
      example: "MCL"

    ControllerTypeName:
      type: string
      enum: [Gamepad, Wheel]
      description: 입력 장치. 기본 Wheel. 저장만 한다(이후 Phase).
      example: "Wheel"

    ConsolePlatformName:
      type: string
      enum: [Pc, Xbox, PlayStation]
      description: 플랫폼. 기본 Pc. 저장만 한다(이후 Phase).
      example: "Pc"

    UnitSystemName:
      type: string
      enum: [Metric, Imperial]
      description: 속도·거리 단위(Metric = km/h, Imperial = mph). 기본 Metric. 저장만 한다(텔레메트리 화면에서 쓴다).
      example: "Metric"

    ThemePreferenceName:
      type: string
      enum: [Light, Dark, System]
      description: 앱 테마. 기본 Dark(D-40, 기존 어두운 화면 유지). System을 고르면 기기 밝기 설정을 따른다.
      example: "Dark"

    RankingSnapshot:
      type: object
      required:
        - trackId
        - trackName
        - gameCode
        - period
        - periodKey
        - entries
      properties:
        trackId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        trackName:
          type: string
          example: "Silverstone"
        gameCode:
          type: string
          example: "F1_25"
        period:
          type: string
          enum: [daily, monthly, yearly]
          example: "monthly"
        periodKey:
          type: string
          example: "2026-07"
        entries:
          type: array
          items:
            $ref: '#/components/schemas/RankingEntry'

    RankingEntry:
      type: object
      required:
        - rank
        - displayName
        - bestLapTimeMs
        - setAt
      properties:
        rank:
          type: integer
          example: 1
        displayName:
          type: string
          example: "홍길동"
        bestLapTimeMs:
          type: integer
          example: 83452
        setAt:
          type: string
          format: date-time
          example: "2026-07-06T09:15:32Z"

    TrackInfo:
      type: object
      required:
        - trackId
        - gameCode
        - name
        - displayOrder
      properties:
        trackId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        gameCode:
          type: string
          example: "F1_25"
        name:
          type: string
          example: "Silverstone"
        countryCode:
          type: string
          nullable: true
          minLength: 2
          maxLength: 2
          description: 국가 코드(ISO 3166-1 alpha-2 대문자). 모르면 null
          example: "GB"
        displayOrder:
          type: integer
          description: 트랙 메뉴 순서(1부터, D-43)
          example: 12

    TrackListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TrackInfo'

    LapRecord:
      type: object
      required:
        - lapId
        - trackName
        - gameCode
        - sessionType
        - lapTimeMs
        - sectors
        - isValid
        - isRankingEligible
        - setAt
        - lapNumber
        - hasTrace
      properties:
        lapNumber:
          type: integer
          description: 세션 안의 랩 번호
          example: 5
        gameMode:
          type: string
          nullable: true
          description: 게임 모드(Agent가 보낸 문자열 그대로, 보통 `GameModeName` 값). 옛 랩은 null
          example: "DriverCareer"
        team:
          $ref: '#/components/schemas/TeamRef'
          nullable: true
        weather:
          $ref: '#/components/schemas/WeatherName'
          nullable: true
        hasTrace:
          type: boolean
          description: 텔레메트리 트레이스가 저장됐는지
          example: true
        lapId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        trackName:
          type: string
          example: "Silverstone"
        gameCode:
          type: string
          example: "F1_25"
        sessionType:
          type: string
          example: "TimeTrial"
        lapTimeMs:
          type: integer
          example: 83452
        sectors:
          type: array
          items:
            $ref: '#/components/schemas/SectorTimeInfo'
        isValid:
          type: boolean
          example: true
        isRankingEligible:
          type: boolean
          example: true
        setAt:
          type: string
          format: date-time
          example: "2026-07-06T09:15:32Z"

    SectorTimeInfo:
      type: object
      required:
        - sectorNumber
        - sectorTimeMs
      properties:
        sectorNumber:
          type: integer
          example: 1
        sectorTimeMs:
          type: integer
          example: 27010

    MyLapRecordResponse:
      type: object
      required:
        - laps
      properties:
        personalBest:
          $ref: '#/components/schemas/PersonalBestInfo'
          nullable: true
        laps:
          type: object
          required:
            - page
            - pageSize
            - total
            - items
          properties:
            page:
              type: integer
              example: 1
            pageSize:
              type: integer
              example: 20
            total:
              type: integer
              example: 57
            items:
              type: array
              items:
                $ref: '#/components/schemas/LapRecord'

    MyTrackSummary:
      type: object
      required:
        - trackId
        - trackName
        - gameCode
        - lapCount
        - lastSetAt
        - displayOrder
      properties:
        trackId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        trackName:
          type: string
          example: "Silverstone"
        gameCode:
          type: string
          example: "F1_25"
        lapCount:
          type: integer
          description: 무효 랩을 포함한 랩 수
          example: 12
        bestValidLapTimeMs:
          type: integer
          nullable: true
          description: 유효 랩 중 최고 랩타임(ms). 유효 랩이 없으면 null
          example: 83452
        lastSetAt:
          type: string
          format: date-time
          description: 이 트랙에서 마지막으로 랩을 세운 시각(UTC)
          example: "2026-07-06T09:15:32Z"
        countryCode:
          type: string
          nullable: true
          description: 국가 코드(ISO 3166-1 alpha-2 대문자). 모르면 null
          example: "GB"
        displayOrder:
          type: integer
          description: 트랙 메뉴 순서(D-43). 이 목록의 순서는 마지막 주행 순 그대로다
          example: 12

    MyTracksResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MyTrackSummary'

    PersonalBestInfo:
      type: object
      required:
        - trackId
        - lapTimeMs
        - setAt
      properties:
        trackId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        lapTimeMs:
          type: integer
          example: 83452
        setAt:
          type: string
          format: date-time
          example: "2026-07-06T09:15:32Z"

    TeamRef:
      type: object
      description: 팀 표시 이름·색(D-33). 스냅샷의 게임 팀 ID를 백엔드 카탈로그로 푼 값(모르는 ID는 `Team {id}` + 회색)
      required:
        - name
        - color
      properties:
        name:
          type: string
          example: "Ferrari"
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: "#E8002D"

    WeatherName:
      type: string
      description: 랩 끝의 날씨(게임 0~5 순서). 모르면 값 대신 null
      enum: [Clear, LightCloud, Overcast, LightRain, HeavyRain, Storm]
      example: "Clear"

    WheelValues:
      type: object
      description: 바퀴 4개 값(퍼센트 0~100)
      required:
        - frontLeft
        - frontRight
        - rearLeft
        - rearRight
      properties:
        frontLeft:
          type: number
          example: 31.0
        frontRight:
          type: number
          example: 18.0
        rearLeft:
          type: number
          example: 24.0
        rearRight:
          type: number
          example: 18.0

    LapCarSnapshot:
      type: object
      description: |
        랩 끝의 차량 스냅샷(D-44). 모든 필드는 null 가능(Agent가 받지 못한 값). 바퀴 묶음은 4개 값이 모두 있을 때만 온다.
        시작 값(`*Start*`)은 랩 시작 직후 값, 끝 값은 랩 끝 값 — "이 랩 사용량"은 앱이 계산한다(ERS 배터리 최대 4,000,000J).
        손상은 퍼센트(0~100), 연료 kg, ERS J. `fuelRemainingLaps`는 MFD 값이라 음수일 수 있다.
      properties:
        teamId:
          type: integer
          nullable: true
          description: 게임 팀 ID(이름·색은 `lap.team`)
          example: 1
        visualTyreCompound:
          type: integer
          nullable: true
          description: 게임의 표시 컴파운드 값(0~255)
          example: 16
        actualTyreCompound:
          type: integer
          nullable: true
          description: 게임의 실제 컴파운드 값(0~255)
          example: 18
        tyreAgeLaps:
          type: integer
          nullable: true
          example: 3
        tyreWearStart:
          $ref: '#/components/schemas/WheelValues'
          nullable: true
        tyreWearEnd:
          $ref: '#/components/schemas/WheelValues'
          nullable: true
        tyreDamage:
          $ref: '#/components/schemas/WheelValues'
          nullable: true
        brakeDamage:
          $ref: '#/components/schemas/WheelValues'
          nullable: true
        frontLeftWingDamage:
          type: integer
          nullable: true
          example: 0
        frontRightWingDamage:
          type: integer
          nullable: true
          example: 10
        rearWingDamage:
          type: integer
          nullable: true
          example: 0
        floorDamage:
          type: integer
          nullable: true
          example: 0
        diffuserDamage:
          type: integer
          nullable: true
          example: 0
        sidepodDamage:
          type: integer
          nullable: true
          example: 20
        gearboxDamage:
          type: integer
          nullable: true
          example: 10
        engineDamage:
          type: integer
          nullable: true
          example: 30
        fuelStartKg:
          type: number
          nullable: true
          example: 24.4
        fuelEndKg:
          type: number
          nullable: true
          example: 22.7
        fuelRemainingLaps:
          type: number
          nullable: true
          example: 13.1
        ersStoreStartJ:
          type: number
          nullable: true
          example: 1494000
        ersStoreEndJ:
          type: number
          nullable: true
          example: 988000
        ersDeployedJ:
          type: number
          nullable: true
          example: 2100000
        ersHarvestedJ:
          type: number
          nullable: true
          example: 1600000
        details:
          type: object
          nullable: true
          additionalProperties: true
          description: |
            그 밖의 값 묶음(D-49, 15 §8): 셋업·엔진 부품 마모·Car Status 나머지·타이어 세트·타임 트라이얼·그 랩의 이벤트 등.
            Agent가 보낸 JSON 객체를 그대로 돌려준다(백엔드는 구조를 해석하지 않는다, 키 순서는 보장하지 않는다). 없으면 null.
          example:
            setup: { frontWing: 5, brakeBias: 56.5 }
            events: [ { code: "FLBK", t: 12.25 } ]

    LapConditions:
      type: object
      description: 랩 끝의 날씨(D-44). 모든 필드는 null 가능
      properties:
        weather:
          $ref: '#/components/schemas/WeatherName'
          nullable: true
        airTempC:
          type: integer
          nullable: true
          example: 21
        trackTempC:
          type: integer
          nullable: true
          example: 31
        rainForecastPercent:
          type: integer
          nullable: true
          example: 4

    LapAssists:
      type: object
      description: |
        드라이버 어시스트(docs/15 §10, D-51). 랩 스냅샷 `details`의 status(TC·ABS)·session(나머지) 값. 모르는 값은 null
      properties:
        tractionControl:
          type: string
          nullable: true
          enum: [Off, Medium, Full]
        antiLockBrakes:
          type: string
          nullable: true
          enum: [Off, On]
        steeringAssist:
          type: string
          nullable: true
          enum: [Off, On]
        brakingAssist:
          type: string
          nullable: true
          enum: [Off, Low, Medium, High]
        gearbox:
          type: string
          nullable: true
          enum: [Manual, ManualSuggested, Automatic]
        racingLine:
          type: string
          nullable: true
          enum: [Off, CornersOnly, Full]

    LapComparison:
      type: object
      description: |
        비교 대상 랩(docs/15 §10, D-51). `isMine`이면 `displayName` = null.
        남의 랩이면 랭킹과 같은 이름 규칙(이름 비공개·지운 사용자 = "익명 드라이버", D-39)
      required:
        - kind
        - lapId
        - lapTimeMs
        - sectors
        - setAt
        - hasTrace
        - isMine
        - sessionType
        - appliedFilters
      properties:
        kind:
          type: string
          enum: [best, leaderboard, lap]
          example: leaderboard
        isMine:
          type: boolean
          example: false
        displayName:
          type: string
          nullable: true
          example: "익명 드라이버"
        team:
          $ref: '#/components/schemas/TeamRef'
          nullable: true
        sessionType:
          type: string
          example: TimeTrial
        appliedFilters:
          type: array
          description: 실제로 적용한 필터. 이 랩의 값을 모르는 필터(팀 없음·어시스트 모름)는 빠진다
          items:
            type: string
            enum: [sameTeam, sameSessionType, sameAssists]
        lapId:
          type: string
          format: uuid
        lapTimeMs:
          type: integer
          example: 97003
        sectors:
          type: array
          items:
            $ref: '#/components/schemas/SectorTimeInfo'
        setAt:
          type: string
          format: date-time
          example: "2026-07-06T09:15:32Z"
        hasTrace:
          type: boolean
          example: true

    LapDetailResponse:
      type: object
      required:
        - lap
        - trackId
      properties:
        lap:
          $ref: '#/components/schemas/LapRecord'
        trackId:
          type: string
          format: uuid
        countryCode:
          type: string
          nullable: true
          example: "SA"
        sessionId:
          type: string
          format: uuid
          nullable: true
          description: 같은 세션 키의 내 세션(`/me/sessions/{sessionId}`). 없으면 null
        car:
          $ref: '#/components/schemas/LapCarSnapshot'
          nullable: true
        conditions:
          $ref: '#/components/schemas/LapConditions'
          nullable: true
        assists:
          $ref: '#/components/schemas/LapAssists'
          nullable: true
        comparison:
          $ref: '#/components/schemas/LapComparison'
          nullable: true
        comparisonUnavailable:
          type: string
          nullable: true
          enum: [notFound, noMatch]
          description: |
            `comparison`이 null인 까닭. `notFound` = 고른 랩 ID가 없거나 남의 비공개(랭킹 부적격) 랩(둘을 구분하지 않는다, D-34)
            · `noMatch` = 조건(필터 포함)에 맞는 최고 랩이 없음. `compare=none`이면 null

    LapTraceResponse:
      type: object
      description: 거리 기준 트레이스(D-45). 7개 배열은 모두 `sampleCount` 길이
      required:
        - lapId
        - resolutionM
        - sampleCount
        - timeMs
        - speedKph
        - throttle
        - brake
        - steer
        - gear
        - rpm
        - extra
      properties:
        lapId:
          type: string
          format: uuid
        resolutionM:
          type: integer
          description: 표본 간격(m). 보통 5, 큰 트레이스는 10·20
          example: 5
        sampleCount:
          type: integer
          example: 1235
        timeMs:
          type: array
          items:
            type: integer
        speedKph:
          type: array
          items:
            type: integer
        throttle:
          type: array
          description: 0~100
          items:
            type: integer
        brake:
          type: array
          description: 0~100
          items:
            type: integer
        steer:
          type: array
          description: −100~100
          items:
            type: integer
        gear:
          type: array
          description: −1~8 (0=N, −1=R)
          items:
            type: integer
        rpm:
          type: array
          items:
            type: integer
        extra:
          type: object
          description: |
            추가 채널 맵(D-49): 채널 이름(`^[A-Za-z0-9]{1,40}$`, 최대 150개) → 같은 길이(`sampleCount`)의 실수 배열.
            채널 목록·단위는 `shared/telemetry/f1_25_udp_spec.md` 카탈로그. 추가 채널이 없으면 빈 객체 `{}`.
          additionalProperties:
            type: array
            items:
              type: number
          example:
            clutch: [0, 0, 12.5]
            brakeTempFL: [512.37, 515.1, 520.0]

    PairingCodeResponse:
      type: object
      required:
        - code
        - expiresAt
      properties:
        code:
          type: string
          description: 표시 형식의 1회용 연결 코드. 서버에는 해시만 남는다.
          pattern: '^[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}$'
          example: "K7F2-9QXM"
        expiresAt:
          type: string
          format: date-time
          description: 만료 시각(UTC). 발급 후 10분.
          example: "2026-10-17T09:10:00Z"

    PairRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          description: 연결 코드. 대소문자와 하이픈·공백은 무시한다.
          example: "K7F2-9QXM"
        deviceName:
          type: string
          maxLength: 50
          description: 장치 이름. 앞뒤 공백을 제거하며, 비어 있으면 "Windows PC"를 쓴다.
          example: "SIM-RIG-PC"

    PairResponse:
      type: object
      required:
        - deviceId
        - deviceKey
      properties:
        deviceId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        deviceKey:
          type: string
          description: 장치 키 원문(base64url, 43자). 이 응답에서 한 번만 내려가며 서버에는 해시만 남는다.
          example: "q3V0v5m4Zk1m8h2X9n7L6c5B4a3S2d1F0g9H8j7K6l5"

    AgentDevice:
      type: object
      required:
        - deviceId
        - name
        - createdAt
      properties:
        deviceId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        name:
          type: string
          example: "SIM-RIG-PC"
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
          description: 마지막 이벤트 수신 시각(UTC). 수신 이력이 없으면 null.
          example: "2026-10-17T09:03:21Z"
        createdAt:
          type: string
          format: date-time
          example: "2026-10-17T09:00:00Z"

    AgentDeviceListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgentDevice'

    GameModeName:
      type: string
      description: |
        게임 모드. 시즌은 DriverCareer·MyTeamCareer·OnlineCareer·ChallengeCareer·GrandPrix에서만 만들어진다.
        Time Trial 모드의 순위표는 저장하지 않는다(Laps·Rankings 담당).
      enum: [Other, DriverCareer, MyTeamCareer, OnlineCareer, ChallengeCareer, GrandPrix, Online, Story]
      example: "DriverCareer"

    SessionTypeName:
      type: string
      description: 세션 유형. Time Trial 세션은 저장하지 않는다.
      enum: [Unknown, Practice, Qualifying, Race]
      example: "Race"

    SessionKindName:
      type: string
      description: 세션 상세 종류. 알 수 없는 값은 Unknown이다.
      enum:
        - Unknown
        - Practice1
        - Practice2
        - Practice3
        - ShortPractice
        - Qualifying1
        - Qualifying2
        - Qualifying3
        - ShortQualifying
        - OneShotQualifying
        - SprintShootout1
        - SprintShootout2
        - SprintShootout3
        - ShortSprintShootout
        - OneShotSprintShootout
        - Race
        - Race2
        - Race3
        - TimeTrial
      example: "Race"

    ResultStatusName:
      type: string
      description: 결과 상태. 알 수 없는 값은 Unknown이다.
      enum: [Unknown, Active, Finished, DidNotFinish, Disqualified, NotClassified, Retired]
      example: "Finished"

    TyreCompoundName:
      type: string
      description: 화면용 타이어 컴파운드. 알 수 없는 값은 Unknown이다.
      enum: [Unknown, Soft, Medium, Hard, Intermediate, Wet]
      example: "Medium"

    SeasonSummary:
      type: object
      description: |
        시즌 요약. 내가 Standings에 없으면 `myPosition`·`myPoints`가, Standings가 비면 `leaderName`·`leaderPoints`가 null이다.
        점수는 int 상한으로 자른 값이다.
      required:
        - seasonId
        - gameCode
        - gameMode
        - firstSessionAt
        - lastSessionAt
        - roundCount
      properties:
        seasonId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        gameCode:
          type: string
          example: "F1_25"
        gameMode:
          $ref: '#/components/schemas/GameModeName'
        firstSessionAt:
          type: string
          format: date-time
          description: 기록된 세션의 분류 시각 최소값(UTC)
          example: "2026-10-01T09:00:00Z"
        lastSessionAt:
          type: string
          format: date-time
          description: 기록된 세션의 분류 시각 최대값(UTC)
          example: "2026-10-17T09:15:32Z"
        roundCount:
          type: integer
          description: 기록된 라운드(그랑프리 주말) 수
          example: 6
        myPosition:
          type: integer
          nullable: true
          description: 내 Standings 순위. 내가 결과에 없으면 null
          example: 3
        myPoints:
          type: integer
          nullable: true
          description: 내 시즌 점수. 내가 결과에 없으면 null
          example: 87
        leaderName:
          type: string
          nullable: true
          description: Standings 1위 드라이버 이름. 결과가 없으면 null
          example: "VERSTAPPEN"
        leaderPoints:
          type: integer
          nullable: true
          description: Standings 1위 점수. 결과가 없으면 null
          example: 120

    SeasonSummaryPage:
      type: object
      required:
        - page
        - pageSize
        - total
        - items
      properties:
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 20
        total:
          type: integer
          example: 2
        items:
          type: array
          items:
            $ref: '#/components/schemas/SeasonSummary'

    SeasonDetail:
      type: object
      required:
        - season
        - rounds
        - standings
      properties:
        season:
          $ref: '#/components/schemas/SeasonSummary'
        rounds:
          type: array
          description: 라운드 번호 오름차순(주말의 첫 세션 시각 순서로 1부터 매긴다)
          items:
            $ref: '#/components/schemas/SeasonRound'
        standings:
          $ref: '#/components/schemas/SeasonStandings'

    SeasonRound:
      type: object
      required:
        - round
        - weekendId
        - trackName
        - firstSessionAt
        - sessions
      properties:
        round:
          type: integer
          example: 1
        weekendId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        trackName:
          type: string
          example: "Bahrain"
        firstSessionAt:
          type: string
          format: date-time
          example: "2026-10-01T09:00:00Z"
        winnerName:
          type: string
          nullable: true
          description: 본 레이스 1위 드라이버 이름. 본 레이스가 없으면 null
          example: "NORRIS"
        myPoints:
          type: integer
          nullable: true
          description: 그 주말 내 점수 합(계산 대상 세션만). 내 결과가 없으면 null
          example: 12
        sessions:
          type: array
          description: 저장된 모든 세션(분류 시각 오름차순)
          items:
            $ref: '#/components/schemas/SeasonRoundSession'

    SeasonRoundSession:
      type: object
      description: 라운드 안의 세션 칩. 내 결과가 없으면 `myPosition`·`myResultStatus`가 null이다.
      required:
        - sessionId
        - sessionType
        - sessionKind
      properties:
        sessionId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        sessionType:
          $ref: '#/components/schemas/SessionTypeName'
        sessionKind:
          $ref: '#/components/schemas/SessionKindName'
        myPosition:
          type: integer
          nullable: true
          example: 4
        myResultStatus:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ResultStatusName'

    SeasonStandings:
      type: object
      required:
        - drivers
        - constructors
      properties:
        drivers:
          type: array
          description: |
            드라이버 순위. 점수 내림차순 → 본 레이스 1위 수, 2위 수 … 내림차순 → 이름 순.
            점수·우승·포디움 집계는 계산 대상 세션(주말·세션 종류별 최신 1건) 기준이고, 우승·포디움·카운트백은 본 레이스만 센다.
          items:
            $ref: '#/components/schemas/DriverStanding'
        constructors:
          type: array
          description: 컨스트럭터 순위. 점수 내림차순 → 우승 수 → 팀 이름 순. 팀 정보가 없는 결과는 제외한다.
          items:
            $ref: '#/components/schemas/ConstructorStanding'

    DriverStanding:
      type: object
      description: 이름·팀·AI 여부는 그 드라이버의 가장 최근 세션 값이다.
      required:
        - position
        - driverKey
        - name
        - teamName
        - teamColor
        - isPlayer
        - isAiControlled
        - points
        - wins
        - podiums
        - cells
      properties:
        position:
          type: integer
          example: 1
        driverKey:
          type: string
          description: 시즌 안의 드라이버 식별 키 (`player` | `driver:{id}` | `name:{NAME}#{raceNumber}` | `car:{sessionRef}:{carIndex}`)
          example: "driver:9"
        name:
          type: string
          description: 드라이버 이름. 이름이 없으면 `Car {carIndex+1}`
          example: "VERSTAPPEN"
        teamName:
          type: string
          example: "Red Bull Racing"
        teamColor:
          type: string
          description: 팀 색 (`#RRGGBB`)
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: "#3671C6"
        isPlayer:
          type: boolean
          example: false
        isAiControlled:
          type: boolean
          example: true
        points:
          type: integer
          example: 120
        wins:
          type: integer
          description: 본 레이스 1위 횟수
          example: 3
        podiums:
          type: integer
          description: 본 레이스 3위 이내 횟수
          example: 5
        cells:
          type: array
          description: 그 드라이버가 결과를 가진 라운드의 결과표 칸(라운드 번호 오름차순)
          items:
            $ref: '#/components/schemas/StandingCell'

    StandingCell:
      type: object
      description: |
        결과표 한 칸(드라이버 × 라운드). `position`·`resultStatus`는 그 라운드 본 레이스의 결과이며 본 레이스 기록이 없으면 null,
        `points`는 그 주말 계산 대상 세션의 점수 합(스프린트 포함)이다.
      required:
        - round
        - points
      properties:
        round:
          type: integer
          example: 1
        position:
          type: integer
          nullable: true
          example: 1
        resultStatus:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ResultStatusName'
        points:
          type: integer
          example: 25

    ConstructorStanding:
      type: object
      required:
        - position
        - teamId
        - teamName
        - teamColor
        - points
        - wins
      properties:
        position:
          type: integer
          example: 1
        teamId:
          type: integer
          description: 게임 팀 ID
          example: 2
        teamName:
          type: string
          example: "Red Bull Racing"
        teamColor:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: "#3671C6"
        points:
          type: integer
          example: 190
        wins:
          type: integer
          example: 3

    SessionSummary:
      type: object
      description: |
        세션 목록 한 줄. `my*`는 내 차 결과에서 읽으며 내 차 결과가 없으면 전부 null이다.
        `myBestLapTimeMs`는 기록이 없으면(0) null, 시즌에 속하지 않은 세션이면 `seasonId`가 null이다.
      required:
        - sessionId
        - classifiedAt
        - trackName
        - sessionType
        - sessionKind
        - gameMode
        - carCount
      properties:
        sessionId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        classifiedAt:
          type: string
          format: date-time
          description: 순위표가 확정된 시각(UTC)
          example: "2026-10-17T09:15:32Z"
        trackName:
          type: string
          example: "Spa"
        sessionType:
          $ref: '#/components/schemas/SessionTypeName'
        sessionKind:
          $ref: '#/components/schemas/SessionKindName'
        gameMode:
          $ref: '#/components/schemas/GameModeName'
        seasonId:
          type: string
          format: uuid
          nullable: true
          description: 시즌에 속하지 않은 세션이면 null
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        carCount:
          type: integer
          description: 활성 결과 행 수
          example: 22
        myPosition:
          type: integer
          nullable: true
          example: 4
        myGridPosition:
          type: integer
          nullable: true
          example: 6
        myResultStatus:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ResultStatusName'
        myBestLapTimeMs:
          type: integer
          nullable: true
          description: 내 베스트 랩(ms). 기록이 없으면 null
          example: 105321
        myPoints:
          type: integer
          nullable: true
          example: 12

    SessionSummaryPage:
      type: object
      required:
        - page
        - pageSize
        - total
        - items
      properties:
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 20
        total:
          type: integer
          example: 4
        items:
          type: array
          items:
            $ref: '#/components/schemas/SessionSummary'

    SessionDetail:
      type: object
      required:
        - session
        - results
      properties:
        session:
          $ref: '#/components/schemas/SessionDetailHeader'
        results:
          type: array
          description: '`position` 오름차순, 같으면 `carIndex` 오름차순'
          items:
            $ref: '#/components/schemas/SessionResult'

    SessionDetailHeader:
      description: 세션 요약의 모든 필드 + 세션 설정. 시즌에 속하지 않은 세션이면 `round`가 null이다.
      allOf:
        - $ref: '#/components/schemas/SessionSummary'
        - type: object
          required:
            - totalLaps
            - aiDifficulty
            - isNetworkGame
          properties:
            totalLaps:
              type: integer
              example: 15
            aiDifficulty:
              type: integer
              example: 85
            isNetworkGame:
              type: boolean
              example: false
            round:
              type: integer
              nullable: true
              description: 시즌 상세의 라운드 번호와 같은 계산. 시즌에 속하지 않으면 null
              example: 7

    SessionResult:
      type: object
      description: |
        세션 결과 한 줄(차 1대). `bestLapTimeMs`·`totalRaceTimeMs`는 0이면 null이고,
        `isFastestLap`은 기록이 있는 행 중 최소값(같으면 모두 true)이다.
        `teamId`·`raceNumber`는 참가자 정보가 없으면 null이며 이때 팀 이름은 `Unknown Team`이다.
      required:
        - position
        - carIndex
        - name
        - teamName
        - teamColor
        - isAiControlled
        - isPlayer
        - gridPosition
        - numLaps
        - isFastestLap
        - penaltiesTimeMs
        - numPenalties
        - numPitStops
        - points
        - resultStatus
        - tyreStints
      properties:
        position:
          type: integer
          example: 1
        carIndex:
          type: integer
          example: 0
        name:
          type: string
          description: 드라이버 이름. 이름이 없으면 `Car {carIndex+1}`
          example: "NORRIS"
        teamId:
          type: integer
          nullable: true
          example: 8
        teamName:
          type: string
          example: "McLaren"
        teamColor:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: "#FF8000"
        raceNumber:
          type: integer
          nullable: true
          example: 4
        isAiControlled:
          type: boolean
          example: true
        isPlayer:
          type: boolean
          example: false
        gridPosition:
          type: integer
          example: 1
        numLaps:
          type: integer
          example: 15
        bestLapTimeMs:
          type: integer
          nullable: true
          example: 104987
        isFastestLap:
          type: boolean
          example: true
        totalRaceTimeMs:
          type: integer
          nullable: true
          description: 총 레이스 시간(ms, 패널티 제외). 없으면 null
          example: 1598765
        penaltiesTimeMs:
          type: integer
          example: 0
        numPenalties:
          type: integer
          example: 0
        numPitStops:
          type: integer
          example: 1
        points:
          type: integer
          example: 25
        resultStatus:
          $ref: '#/components/schemas/ResultStatusName'
        tyreStints:
          type: array
          description: 스틴트 번호 순서
          items:
            $ref: '#/components/schemas/TyreStint'

    TyreStint:
      type: object
      required:
        - endLap
        - visualCompound
      properties:
        endLap:
          type: integer
          description: 그 스틴트가 끝난 랩
          example: 7
        visualCompound:
          $ref: '#/components/schemas/TyreCompoundName'
        actualCompound:
          type: string
          nullable: true
          description: 게임 중립 문자열 라벨 (예 `C3`). 없으면 null
          example: "C3"

security:
  - BearerAuth: []
